name: Daily Stock Analysis

on:
  schedule:
    # 09:15 UTC is 17:15 Taipei Time (確保當日盤後籌碼資料就緒，且避開 17:00 整點塞車)
    - cron: '15 9 * * 1-5'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: write  # 允許 peaceiris/actions-gh-pages 推送到 gh-pages 分支

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    environment: TG_BOT
    strategy:
      max-parallel: 1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Analysis Script
        if: false   # 暫停執行，需要時移除此行即可重新啟用
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python main.py

      - name: Run Industry Group Analysis
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python industry_analyzer.py

      - name: Generate Portal Index
        if: always()
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python generate_portal.py


      - name: Upload Industry Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industry-reports-${{ github.run_number }}
          path: reports/*.txt
          if-no-files-found: warn

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          force_orphan: true
          commit_message: '🚀 Deploy reports [${{ github.run_number }}]'
