name: Daily Stock Analysis

on:
  schedule:
    # 09:00 UTC is 17:00 Taipei Time (Market closes at 13:30, after-market at 14:30. Data is typically ready by 17:00)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  analyze_and_notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Analysis Script
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # You can optionally set the STOCK_ID here if you want to run for a specific stock
          # STOCK_ID: "2344"
        run: |
          python main.py
