name: Daily Stock Analysis

on:
  schedule:
    # 09:15 UTC is 17:15 Taipei Time (確保當日盤後籌碼資料就緒，且避開 17:00 整點塞車)
    - cron: '15 9 * * 1-5'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: write  # 允許 peaceiris/actions-gh-pages 推送到 gh-pages 分支

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    environment: TG_BOT
    strategy:
      max-parallel: 1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Analysis Script
        if: false   # 暫停執行，需要時移除此行即可重新啟用
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python main.py

      - name: Run Industry Group Analysis
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python industry_analyzer.py

      - name: Generate Portal Index
        if: always()
        run: |
          python - << 'PYEOF'
          import os, glob, re
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          TW_TZ = timezone(timedelta(hours=8))
          now_str = datetime.now(TW_TZ).strftime("%Y-%m-%d %H:%M (UTC+8)")
          report_dir = Path("reports")
          html_files = sorted(report_dir.glob("*.html"), key=lambda p: p.name)

          # 解析族群名稱和日期
          items = []
          for path in html_files:
              m = re.match(r"(.+)_(\d{8})\.html", path.name)
              if m:
                  raw_name = m.group(1)
                  date_str = m.group(2)
                  display = raw_name.replace("_", " ")
                  items.append({"display": display, "file": path.name, "date": f"{date_str[:4]}-{date_str[4:6]}-{date_str[6:]}" })

          # 產生 card HTML
          cards = ""
          for it in items:
              cards += f"""
              <a href="{it['file']}" class="card">
                <div class="card-icon">📊</div>
                <div class="card-title">{it['display']}</div>
                <div class="card-date">{it['date']}</div>
              </a>"""

          no_reports = "<p class='no-report'>尚未產生任何族群報告。</p>" if not cards else ""

          html = f"""<!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TWStockPilot — 台股族群量化分析</title>
            <meta name="description" content="TWStockPilot 台股族群量化分析報告中心，每日盤後自動更新。">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
            <style>
              *, *::before, *::after {{ box-sizing: border-box; margin: 0; padding: 0; }}
              body {{
                font-family: 'Inter', sans-serif;
                background: #0d1117;
                color: #e6edf3;
                min-height: 100vh;
              }}
              header {{
                background: linear-gradient(135deg, #1a2236 0%, #0d1117 100%);
                border-bottom: 1px solid #21262d;
                padding: 2.5rem 1.5rem 2rem;
                text-align: center;
              }}
              .logo {{ font-size: 2.4rem; font-weight: 700; letter-spacing: -1px; }}
              .logo span {{ color: #60a5fa; }}
              .subtitle {{ margin-top: .5rem; color: #8b949e; font-size: .95rem; }}
              .updated {{
                display: inline-block;
                margin-top: 1rem;
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 20px;
                padding: .3rem .9rem;
                font-size: .8rem;
                color: #8b949e;
              }}
              .updated span {{ color: #3fb950; font-weight: 600; }}
              main {{ max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem; }}
              .section-title {{
                font-size: 1rem;
                font-weight: 600;
                color: #8b949e;
                text-transform: uppercase;
                letter-spacing: .08em;
                margin-bottom: 1.2rem;
                padding-bottom: .5rem;
                border-bottom: 1px solid #21262d;
              }}
              .grid {{
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1rem;
              }}
              .card {{
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                background: #161b22;
                border: 1px solid #21262d;
                border-radius: 12px;
                padding: 1.3rem 1.4rem;
                text-decoration: none;
                color: inherit;
                transition: border-color .2s, transform .2s, box-shadow .2s;
              }}
              .card:hover {{
                border-color: #60a5fa;
                transform: translateY(-3px);
                box-shadow: 0 8px 24px rgba(96,165,250,.15);
              }}
              .card-icon {{ font-size: 1.8rem; margin-bottom: .7rem; }}
              .card-title {{ font-size: 1.05rem; font-weight: 700; color: #e6edf3; margin-bottom: .4rem; }}
              .card-date {{ font-size: .8rem; color: #8b949e; }}
              .no-report {{ color: #8b949e; text-align: center; padding: 3rem; }}
              footer {{
                text-align: center;
                padding: 2rem 1rem;
                color: #484f58;
                font-size: .8rem;
                border-top: 1px solid #21262d;
              }}
            </style>
          </head>
          <body>
            <header>
              <div class="logo">TW<span>Stock</span>Pilot</div>
              <p class="subtitle">台股族群量化分析 · 每日盤後自動更新</p>
              <div class="updated">最後更新：<span>{now_str}</span></div>
            </header>
            <main>
              <p class="section-title">族群報告</p>
              <div class="grid">{cards}</div>
              {no_reports}
            </main>
            <footer>
              ⚠️ 本報告為量化模型輸出，僅供 AI 輔助分析參考，不構成投資建議。
            </footer>
          </body>
          </html>"""

          # 移除多餘縮排
          lines = html.splitlines()
          cleaned = "\n".join(line[10:] if line.startswith(" " * 10) else line for line in lines)
          (report_dir / "index.html").write_text(cleaned, encoding="utf-8")
          print(f"✅ index.html 已產生，共 {len(items)} 份族群報告")
          PYEOF

      - name: Upload Industry Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industry-reports-${{ github.run_number }}
          path: reports/*.txt
          if-no-files-found: warn

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          force_orphan: true
          commit_message: '🚀 Deploy reports [${{ github.run_number }}]'
